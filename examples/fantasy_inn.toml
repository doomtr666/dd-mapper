# THE CROOKED LANTERN — a village inn at night, Dungeondraft's own assets only.
# dd-mapper generate examples/fantasy_inn.toml --out fantasy_inn.dungeondraft_map --packs assets/packs
#
# The inn stands x 4 to 24, y 4 to 18; the road runs south of it, the stable
# yard east.
#   Common room (south-west, 13 x 10): the hearth, the bar, four round tables.
#   The snug (north-west): a quiet table for those who pay for quiet.
#   Stair landing (north middle): the way up to the rooms.
#   Kitchen (north-east): oven, stove and a back door to the yard.
#   Storeroom (south-east): kegs, sacks and the cellar trapdoor.

[style]
floor = "res://textures/tilesets/simple/tileset_wood_interlaced.png"
wall = "res://textures/walls/wood_02.png"
door = "res://textures/portals/door_01.png"
background = "res://textures/terrain/terrain_grass.png"
ambient = "3e4252"

[map]
width = 36
height = 26

# --- Structure ------------------------------------------------------------------------

[[room]]   # R0: the inn
shape = { type = "rectangle", x = 4, y = 4, width = 20, height = 14 }

[[wall]]   # W0: common room | snug and landing
