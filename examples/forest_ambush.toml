# AMBUSH ON THE OLD TOLL ROAD — a forest encounter by day, Dungeondraft's own assets only.
# dd-mapper generate examples/forest_ambush.toml --out forest_ambush.dungeondraft_map --packs assets/packs
#
# The road crosses the wood from west to east. A felled pine blocks it; the
# merchant's wagon lies smashed just before, its ox dead in the traces.
#   The bandits watch from behind the boulders north of the road.
#   Their camp (north-west): tents, a fire, the loot, a prisoner in a cage.
#   South-east, off the road: a ring of old standing stones, where mushrooms glow.

[style]
background = "res://textures/terrain/terrain_grass.png"
ambient = "c4c0ac"

[map]
width = 36
height = 26

# --- The ground -----------------------------------------------------------------------------

[[terrain]]   # moss under the pines, north
asset = "res://textures/terrain/terrain_moss.png"
shape = { type = "tunnel", points = [[-1, 2], [12, 1], [24, 3], [37, 1.5]], width = 6 }
falloff = 2.5
roughness = 0.6
seed = 1

[[terrain]]   # and south
asset = "res://textures/terrain/terrain_moss.png"
shape = { type = "tunnel", points = [[-1, 24], [14, 25], [37, 24]], width = 6 }
falloff = 2.5
roughness = 0.6
seed = 2

[[terrain]]   # the old toll road
asset = "res://textures/terrain/terrain_dirt.png"
shape = { type = "tunnel", points = [[-1, 16], [12, 15.5], [24, 12.5], [37, 11]], width = 3 }
falloff = 1.2
roughness = 0.35
seed = 3

[[terrain]]   # the bandits' trampled clearing
asset = "res://textures/terrain/terrain_dirt.png"
shape = { type = "chamber", x = 8, y = 6, radius = 3.5 }
falloff = 1.5
roughness = 0.5
seed = 4

[[terrain]]   # bare rock inside the stone ring
asset = "res://textures/terrain/terrain_rocky.png"
shape = { type = "chamber", x = 28, y = 20.5, radius = 2.6 }
falloff = 1.2
roughness = 0.3
seed = 5

[[path]]   # wheel ruts
asset = "res://textures/paths/wagon_trail.png"
points = [[-1, 16.1], [12, 15.6], [24, 12.6], [37, 11.1]]
width = 1.8

[[path]]   # a footpath from the road to the stones
asset = "res://textures/paths/path_blender_02.png"
points = [[22, 13.5], [24.5, 16.5], [27, 18.5]]
width = 0.8

