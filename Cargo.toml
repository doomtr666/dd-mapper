[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
base64 = "0.23"
dd-catalog = { path = "crates/dd-catalog" }
dd-domain = { path = "crates/dd-domain" }
dd-format = { path = "crates/dd-format" }
dd-gen = { path = "crates/dd-gen" }
dd-render = { path = "crates/dd-render" }
dd-app = { path = "crates/dd-app" }
dd-catalog-io = { path = "crates/dd-catalog-io" }
dd-setup = { path = "crates/dd-setup" }
i_overlay = "9.1"
insta = "1.49"
indexmap = { version = "2", features = ["serde"] }
proptest = "1.12"
rmcp = { version = "3.7", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync"] }
tiny-skia = "0.12"
toml = "1.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
